<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SMM Panel - Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.topbar{background:rgba(30,41,59,0.9);backdrop-filter:blur(20px);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(51,65,85,0.3);position:sticky;top:0;z-index:100}
.topbar h2{font-size:18px;font-weight:800;color:#fff;letter-spacing:-0.5px}
.topbar h2 span{background:linear-gradient(135deg,#6366f1,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar-right{display:flex;align-items:center;gap:12px}
.bal-chip{background:rgba(15,23,42,0.8);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;color:#4ade80;border:1px solid rgba(74,222,128,0.2);backdrop-filter:blur(10px)}
.bal-chip i{color:#4ade80;margin-right:5px}
.btn-icon{background:rgba(15,23,42,0.6);border:1px solid rgba(51,65,85,0.3);border-radius:10px;color:#94a3b8;font-size:16px;cursor:pointer;padding:8px 10px;transition:all .3s;width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.btn-icon:hover{background:#6366f1;color:#fff;border-color:#6366f1;transform:scale(1.05)}
.nav{display:flex;background:rgba(30,41,59,0.95);backdrop-filter:blur(20px);border-top:1px solid rgba(51,65,85,0.3);position:fixed;bottom:0;left:0;right:0;z-index:100;padding:4px 0 env(safe-area-inset-bottom,8px)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;color:#64748b;text-decoration:none;font-size:10px;font-weight:600;gap:2px;transition:all .3s;border-radius:12px;margin:0 4px}
.nav a i{font-size:20px;transition:all .3s}
.nav a.active{color:#6366f1}
.nav a.active i{transform:scale(1.1)}
.nav a:hover:not(.active){color:#94a3b8}
.content{padding:16px;padding-bottom:80px}
.card{background:rgba(30,41,59,0.6);backdrop-filter:blur(10px);border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid rgba(51,65,85,0.2);transition:all .3s}
.card:hover{border-color:rgba(99,102,241,0.2)}
.section-title{font-size:13px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title i{color:#6366f1}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px}
.field select{width:100%;padding:12px 14px;background:rgba(15,23,42,0.6);border:1px solid rgba(51,65,85,0.3);border-radius:10px;color:#fff;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:all .3s;appearance:none;cursor:pointer}
.field select:focus{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,0.1)}
.field select option{background:#0f172a;color:#e2e8f0;padding:10px}
.field input{width:100%;padding:12px 14px;background:rgba(15,23,42,0.6);border:1px solid rgba(51,65,85,0.3);border-radius:10px;color:#fff;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:all .3s}
.field input:focus{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,0.1)}
.field textarea{resize:none;height:70px;width:100%;padding:12px 14px;background:rgba(15,23,42,0.6);border:1px solid rgba(51,65,85,0.3);border-radius:10px;color:#fff;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:all .3s}
.field textarea:focus{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,0.1)}
.service-desc-box{background:rgba(15,23,42,0.6);border:1px solid rgba(51,65,85,0.3);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.service-desc-box .name{font-size:15px;font-weight:700;color:#fff;margin-bottom:4px}
.service-desc-box .price{font-size:13px;color:#4ade80;font-weight:600}
.service-desc-box .desc{font-size:12px;color:#94a3b8;margin-top:6px;line-height:1.5}
.service-desc-box .limits{font-size:12px;color:#64748b;margin-top:4px}
.price-calc{background:rgba(15,23,42,0.6);border:1px solid rgba(51,65,85,0.3);border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.price-calc span{color:#94a3b8;font-size:13px;font-weight:500}
.price-calc strong{background:linear-gradient(135deg,#4ade80,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:18px;font-weight:800}
.btn-order{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all .3s;box-shadow:0 4px 20px rgba(99,102,241,0.25)}
.btn-order:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(99,102,241,0.35)}
.btn-order:active{transform:translateY(0)}
.btn-order:disabled{background:#334155;color:#64748b;cursor:not-allowed;transform:none;box-shadow:none}
.empty{text-align:center;padding:30px 20px;color:#475569}
.empty i{font-size:30px;margin-bottom:10px;display:block;opacity:0.5}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(30,41,59,0.95);backdrop-filter:blur(20px);color:#fff;padding:14px 24px;border-radius:14px;font-size:14px;font-weight:500;z-index:999;border:1px solid rgba(51,65,85,0.3);display:none;white-space:nowrap;box-shadow:0 10px 40px rgba(0,0,0,0.4)}
.toast.show{display:block;animation:slideUp 0.3s ease-out}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.toast.success{border-color:rgba(74,222,128,0.3);color:#4ade80}
.toast.error{border-color:rgba(248,113,113,0.3);color:#fca5a5}
.loader{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
#loadingScreen{position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e1b4b);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#loadingScreen.hide{opacity:0;pointer-events:none}
.loading-spinner{width:48px;height:48px;border:3px solid rgba(99,102,241,0.1);border-top:3px solid #6366f1;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
.loading-text{color:#94a3b8;font-size:14px;font-weight:500;letter-spacing:1px}
.loading-dots{display:inline-block;animation:dots 1.4s infinite}
@keyframes dots{0%,20%{content:''}40%{content:'.'}60%{content:'..'}80%,100%{content:'...'}}
.order-form{display:none}
.order-form.show{display:block}
</style>
</head>
<body>

<!-- Loading Screen -->
<div id="loadingScreen">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading<span class="loading-dots">...</span></div>
</div>

<div class="topbar">
  <h2><span>SMM</span>Panel</h2>
  <div class="topbar-right">
    <div class="bal-chip"><i class="fa-solid fa-wallet"></i><span id="topBalance">0.00</span></div>
    <button class="btn-icon" onclick="doLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
  </div>
</div>

<div class="content" id="mainContent">
  
  <!-- Category & Service Selection -->
  <div class="card">
    <div class="section-title"><i class="fa-solid fa-tag"></i>Services & Categories</div>
    
    <div class="field">
      <label>Select Category</label>
      <select id="catSelect" onchange="updateServices()">
        <option value="">Select category</option>
      </select>
    </div>

    <div class="field">
      <label>Select Service</label>
      <select id="svcSelect" onchange="selectService()">
        <option value="">Select service</option>
      </select>
    </div>
  </div>

  <!-- Service Details -->
  <div id="serviceDetails" style="display:none">
    <div class="card service-desc-box">
      <div class="name" id="svcName">-</div>
      <div class="price" id="svcPrice">₹0.0000 / 1K</div>
      <div class="limits" id="svcLimits">Min: 0 | Max: 0</div>
      <div class="desc" id="svcDesc">No description available</div>
    </div>
  </div>

  <!-- Order Form -->
  <div class="card order-form" id="orderFormCard">
    <div class="section-title"><i class="fa-solid fa-cart-plus"></i>Place Order</div>
    
    <div class="field">
      <label>Link / URL</label>
      <input type="url" id="orderLink" placeholder="https://instagram.com/...">
    </div>
    <div class="field">
      <label>Quantity</label>
      <input type="number" id="orderQty" placeholder="Enter quantity" oninput="calcPrice()">
      <div id="qtyHint" style="font-size:11px;color:#475569;margin-top:5px">Min: 0 | Max: 0</div>
    </div>
    <div class="price-calc">
      <span><i class="fa-solid fa-calculator" style="margin-right:6px"></i>Estimated Price</span>
      <strong id="calcPrice">₹0.00</strong>
    </div>
    <button class="btn-order" id="orderBtn" onclick="placeOrder()"><i class="fa-solid fa-check-circle" style="margin-right:8px"></i>Place Order</button>
  </div>
</div>

<nav class="nav">
  <a href="dash.html" class="active"><i class="fa-solid fa-house"></i>Home</a>
  <a href="myorder.html"><i class="fa-solid fa-list-check"></i>Orders</a>
  <a href="addfund.html"><i class="fa-solid fa-plus-circle"></i>Add Fund</a>
</nav>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, get, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDXvkO4mAyxA6N31LuRhq0wP5vkEhxAWHo",
  authDomain: "welcome-7a415.firebaseapp.com",
  databaseURL: "https://welcome-7a415-default-rtdb.firebaseio.com",
  projectId: "welcome-7a415",
  storageBucket: "welcome-7a415.firebasestorage.app",
  messagingSenderId: "135915636503",
  appId: "1:135915636503:web:f182c1fb52514587041952"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null, userData = null, selectedService = null;
let allCategories = [], allServices = [];

// Loading screen hide
setTimeout(() => {
  document.getElementById('loadingScreen').classList.add('hide');
}, 800);

// ===== AUTH STATE =====
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'index.html'; return; }
  currentUser = user;
  
  const snap = await get(ref(db, 'users/' + user.uid));
  if (snap.exists()) {
    userData = snap.val();
    document.getElementById('topBalance').textContent = parseFloat(userData.balance || 0).toFixed(2);
  }
  
  // Start real-time listeners
  listenCategories();
  listenServices();
  
  // Listen balance updates
  onValue(ref(db, 'users/' + user.uid + '/balance'), (s) => {
    if (s.exists()) document.getElementById('topBalance').textContent = parseFloat(s.val()).toFixed(2);
  });
});

// ===== REAL-TIME CATEGORIES LISTENER =====
function listenCategories() {
  onValue(ref(db, 'categories'), (snap) => {
    allCategories = [];
    if (snap.exists()) {
      snap.forEach(c => {
        allCategories.push({ id: c.key, ...c.val() });
      });
    }
    populateCategorySelect();
    // If a category was selected, refresh services dropdown
    const currentCat = document.getElementById('catSelect').value;
    if (currentCat) {
      updateServices();
    }
  });
}

// ===== REAL-TIME SERVICES LISTENER =====
function listenServices() {
  onValue(ref(db, 'services'), (snap) => {
    allServices = [];
    if (snap.exists()) {
      snap.forEach(s => {
        allServices.push({ id: s.key, ...s.val() });
      });
    }
    // Refresh dropdown based on current category
    const currentCat = document.getElementById('catSelect').value;
    if (currentCat) {
      updateServices();
    } else {
      // If no category selected, just populate the service dropdown empty
      const svcSelect = document.getElementById('svcSelect');
      svcSelect.innerHTML = '<option value="">Select service</option>';
    }
    // If a service was previously selected, re-select it if still exists
    const currentSvcId = document.getElementById('svcSelect')?.value;
    if (currentSvcId) {
      const stillExists = allServices.some(s => s.id === currentSvcId);
      if (!stillExists) {
        document.getElementById('orderFormCard').classList.remove('show');
        document.getElementById('serviceDetails').style.display = 'none';
        selectedService = null;
      }
    }
  });
}

// ===== POPULATE CATEGORY DROPDOWN =====
function populateCategorySelect() {
  const select = document.getElementById('catSelect');
  const currentVal = select.value;
  select.innerHTML = '<option value="">Select category</option>';
  
  allCategories.forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat.id;
    opt.textContent = cat.name || cat.id;
    select.appendChild(opt);
  });
  
  // Restore previous selection if still exists
  if (currentVal && allCategories.some(c => c.id === currentVal)) {
    select.value = currentVal;
  } else {
    select.value = '';
  }
}

// ===== UPDATE SERVICES BASED ON CATEGORY =====
window.updateServices = function() {
  const catId = document.getElementById('catSelect').value;
  const svcSelect = document.getElementById('svcSelect');
  svcSelect.innerHTML = '<option value="">Select service</option>';
  
  document.getElementById('orderFormCard').classList.remove('show');
  document.getElementById('serviceDetails').style.display = 'none';
  selectedService = null;
  
  if (!catId) return;
  
  const filtered = allServices.filter(s => s.categoryId === catId);
  
  if (filtered.length === 0) {
    svcSelect.innerHTML = '<option value="">No services available in this category</option>';
    return;
  }
  
  filtered.forEach(svc => {
    const opt = document.createElement('option');
    opt.value = svc.id;
    opt.textContent = `${svc.name} - ₹${parseFloat(svc.price).toFixed(4)}/1K`;
    opt.dataset.svc = JSON.stringify(svc);
    svcSelect.appendChild(opt);
  });
};

// ===== SELECT SERVICE =====
window.selectService = function() {
  const svcSelect = document.getElementById('svcSelect');
  const selected = svcSelect.options[svcSelect.selectedIndex];
  
  if (!selected || !selected.value) {
    document.getElementById('orderFormCard').classList.remove('show');
    document.getElementById('serviceDetails').style.display = 'none';
    selectedService = null;
    return;
  }
  
  const svcData = allServices.find(s => s.id === selected.value);
  if (!svcData) return;
  
  selectedService = svcData;
  
  document.getElementById('serviceDetails').style.display = 'block';
  document.getElementById('svcName').textContent = svcData.name;
  document.getElementById('svcPrice').textContent = `₹${parseFloat(svcData.price).toFixed(4)} / 1K`;
  document.getElementById('svcLimits').textContent = `Min: ${svcData.minOrder} | Max: ${svcData.maxOrder}`;
  document.getElementById('svcDesc').textContent = svcData.description || 'No description available';
  
  document.getElementById('orderFormCard').classList.add('show');
  document.getElementById('qtyHint').textContent = `Min: ${svcData.minOrder} | Max: ${svcData.maxOrder}`;
  
  document.getElementById('orderQty').value = '';
  document.getElementById('calcPrice').textContent = '₹0.00';
  document.getElementById('orderLink').value = '';
  
  setTimeout(() => {
    document.getElementById('orderFormCard').scrollIntoView({ behavior: 'smooth' });
  }, 300);
};

// ===== CALCULATE PRICE =====
window.calcPrice = function() {
  if (!selectedService) return;
  const qty = parseInt(document.getElementById('orderQty').value) || 0;
  const pricePerUnit = parseFloat(selectedService.price) / 1000;
  const totalPrice = qty * pricePerUnit;
  document.getElementById('calcPrice').textContent = '₹' + (isNaN(totalPrice) ? '0.00' : totalPrice.toFixed(4));
};

// ===== PLACE ORDER =====
window.placeOrder = async function() {
  if (!selectedService || !currentUser) {
    showToast('Please select a service first.', 'error');
    return;
  }
  
  const link = document.getElementById('orderLink').value.trim();
  const qty = parseInt(document.getElementById('orderQty').value);
  
  if (!link) { showToast('Please enter a link.', 'error'); return; }
  if (!qty || qty < selectedService.minOrder || qty > selectedService.maxOrder) {
    showToast(`Quantity must be between ${selectedService.minOrder} and ${selectedService.maxOrder}.`, 'error');
    return;
  }
  
  const pricePerUnit = parseFloat(selectedService.price) / 1000;
  const totalPrice = qty * pricePerUnit;
  
  const balSnap = await get(ref(db, 'users/' + currentUser.uid + '/balance'));
  const bal = parseFloat(balSnap.val() || 0);
  if (bal < totalPrice) { 
    showToast('Insufficient balance. Please add funds.', 'error'); 
    return; 
  }
  
  const btn = document.getElementById('orderBtn');
  btn.disabled = true; 
  btn.innerHTML = '<span class="loader"></span>Placing...';
  
  try {
    const newBal = bal - totalPrice;
    await set(ref(db, 'users/' + currentUser.uid + '/balance'), newBal);
    const orderRef = push(ref(db, 'orders'));
    await set(orderRef, {
      userId: currentUser.uid, 
      userEmail: currentUser.email,
      serviceId: selectedService.id, 
      serviceName: selectedService.name,
      link, 
      quantity: qty, 
      price: totalPrice,
      status: 'pending', 
      createdAt: Date.now()
    });
    showToast('✅ Order placed successfully!', 'success');
    document.getElementById('orderQty').value = '';
    document.getElementById('orderLink').value = '';
    document.getElementById('calcPrice').textContent = '₹0.00';
    document.getElementById('topBalance').textContent = newBal.toFixed(2);
  } catch(e) {
    showToast('Failed to place order. Try again.', 'error');
    console.error(e);
  }
  btn.disabled = false; 
  btn.innerHTML = '<i class="fa-solid fa-check-circle" style="margin-right:8px"></i>Place Order';
};

// ===== LOGOUT =====
window.doLogout = async function() {
  await signOut(auth);
  window.location.href = 'index.html';
};

// ===== TOAST =====
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; 
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 3500);
}

// Make functions globally accessible for inline onclick
window.updateServices = updateServices;
window.selectService = selectService;
window.calcPrice = calcPrice;
window.placeOrder = placeOrder;
window.doLogout = doLogout;
</script>
</body>
</html>
